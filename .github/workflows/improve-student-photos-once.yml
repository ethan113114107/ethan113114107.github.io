name: Improve student photo display quality (one-time)
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/improve-student-photos-once.yml'
permissions:
  contents: write
jobs:
  improve:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Install image library
        run: python -m pip install Pillow
      - name: Improve JPEG output without claiming recovered details
        shell: python
        run: |
          from PIL import Image, ImageFilter
          from pathlib import Path
          photos = [Path('graph/tcu-track-sunset.jpg'), Path('graph/tcu-classroom.jpg'), Path('graph/tcu-department-office.jpg')]
          for photo in photos:
              with Image.open(photo) as input_img:
                  img = input_img.convert('RGB')
                  original = img.size
                  out = img.resize((original[0] * 2, original[1] * 2), Image.Resampling.LANCZOS)
                  out = out.filter(ImageFilter.UnsharpMask(radius=1.0, percent=80, threshold=3))
                  out.save(photo, 'JPEG', quality=95, subsampling=0, optimize=True, progressive=True)
              with Image.open(photo) as verify:
                  verify.verify()
              print(photo, original, '->', (original[0]*2, original[1]*2), photo.stat().st_size)
      - name: Commit only the three image updates
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add graph/tcu-track-sunset.jpg graph/tcu-classroom.jpg graph/tcu-department-office.jpg
          if ! git diff --cached --quiet; then
            git commit -m "Improve perceived clarity of three student photos"
            git push origin HEAD:main
          fi
