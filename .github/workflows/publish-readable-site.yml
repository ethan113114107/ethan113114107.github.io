name: Build department website from readable source
on:
  push:
    branches: ['site/real-photo-assets-20261022']
    paths: ['.github/site-publish-ready.txt']
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency:
  group: tcu-readable-site-build
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: site/real-photo-assets-20261022
      - name: Download attributed photographs already prepared in this repository
        uses: actions/download-artifact@v4
        with:
          name: tcu-photo-assets
          run-id: 39718144101
          github-token: ${{ github.token }}
          path: photo-assets
      - name: Install video encoder
        run: sudo apt-get update -qq && sudo apt-get install -y ffmpeg
      - name: Build and check the public website
        run: python .github/scripts/build_department_site.py
      - name: Commit only the website deliverables to the design branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html studentworks.html ai-collaboration.html photo-credits.html 404.html graph .nojekyll AI-COLLABORATION-FULL.txt WEBSITE-SOURCES.md WEBSITE-TESTS.json
          if ! git diff --cached --quiet; then
            git commit -m 'Build complete academic department website with attributed real photographs'
            git push origin HEAD:site/real-photo-assets-20261022
          fi
      - name: Save deployable website package
        uses: actions/upload-artifact@v4
        with:
          name: tcu-complete-public-site
          path: |
            index.html
            studentworks.html
            ai-collaboration.html
            photo-credits.html
            404.html
            graph/
            .nojekyll
            AI-COLLABORATION-FULL.txt
            WEBSITE-SOURCES.md
            WEBSITE-TESTS.json
          include-hidden-files: true
          retention-days: 7
