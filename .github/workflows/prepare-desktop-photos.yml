name: Prepare desktop-resolution photographs
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/prepare-desktop-photos.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  upscale:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - name: Install imaging library
        run: python -m pip install --disable-pip-version-check Pillow
      - name: Smooth interpolation from previously committed photos
        shell: python
        run: |
          from PIL import Image, ImageFilter
          from pathlib import Path
          files = [
              Path('graph/tcu-track-sunset.jpg'),
              Path('graph/tcu-classroom.jpg'),
              Path('graph/tcu-department-office.jpg'),
          ]
          for path in files:
              with Image.open(path) as source:
                  source.load()
                  before = source.size
                  if max(before) >= 2200:
                      print('Already prepared:', path, before)
                      continue
                  # Interpolation reduces apparent pixelation but cannot
                  # recreate details lost in the originally downscaled files.
                  result = source.convert('RGB').resize(
                      (source.width * 3, source.height * 3),
                      resample=Image.Resampling.LANCZOS
                  )
                  result = result.filter(ImageFilter.UnsharpMask(
                      radius=1.0, percent=75, threshold=4
                  ))
                  result.save(path, 'JPEG', quality=95, subsampling=0,
                              progressive=True, optimize=True)
                  print(path, before, '->', result.size,
                        'bytes:', path.stat().st_size)
      - name: Commit just the photo improvements
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add graph/tcu-track-sunset.jpg graph/tcu-classroom.jpg graph/tcu-department-office.jpg
          if git diff --cached --quiet; then
            echo 'No files to change'
          else
            git commit -m 'Increase photo pixel dimensions for large screens'
            git push origin HEAD:main
          fi
