name: Improve resolution of student photographs (one-time)
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/upscale-student-photos-once.yml'
permissions:
  contents: write
jobs:
  image-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Install Pillow
        run: python -m pip install Pillow
      - name: Prepare crisp 2x photographs from previously uploaded web copies
        shell: python
        run: |
          from PIL import Image, ImageFilter
          from pathlib import Path
          files=[
            Path('graph/tcu-track-sunset.jpg'),
            Path('graph/tcu-classroom.jpg'),
            Path('graph/tcu-department-office.jpg'),
          ]
          for path in files:
            with Image.open(path) as src:
              rgb = src.convert('RGB')
              old = rgb.size
              # Lanczos is high-quality resampling, NOT new photographic detail.
              out = rgb.resize((old[0]*2,old[1]*2),Image.Resampling.LANCZOS)
              out = out.filter(ImageFilter.UnsharpMask(radius=1.15,percent=90,threshold=3))
              out.save(path,format='JPEG',quality=95,subsampling=0,optimize=True,progressive=True)
              with Image.open(path) as check:
                check.verify()
              print(path,old,'->',(old[0]*2,old[1]*2),path.stat().st_size)
      - name: Commit the three improved images without touching pages or evidence
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add graph/tcu-track-sunset.jpg graph/tcu-classroom.jpg graph/tcu-department-office.jpg
          git diff --cached --quiet || git commit -m 'Improve display quality of three student photographs'
          git push
