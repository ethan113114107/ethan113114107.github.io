name: Import verified TCU website
on:
  push:
    branches: [main]
    paths: ['.github/tcu-site-release.xz']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: tcu-site-import
  cancel-in-progress: false
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Expand and commit the verified website
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          SOURCE_COMMIT: ${{ github.sha }}
        shell: python
        run: |
          import os, json, base64, lzma, hashlib, urllib.request
          repo = os.environ['REPOSITORY']
          prefix = 'https://api.github.com/repos/' + repo
          def api(path, data=None, method='GET'):
              body = None if data is None else json.dumps(data).encode()
              req = urllib.request.Request(prefix + path, data=body, method=method)
              req.add_header('Authorization', 'Bearer ' + os.environ['GH_TOKEN'])
              req.add_header('Accept', 'application/vnd.github+json')
              req.add_header('X-GitHub-Api-Version', '2022-11-28')
              if body is not None:
                  req.add_header('Content-Type', 'application/json')
              with urllib.request.urlopen(req, timeout=60) as response:
                  return json.load(response)
          source = api('/contents/.github/tcu-site-release.xz?ref=' + os.environ['SOURCE_COMMIT'])
          release = json.loads(lzma.decompress(base64.b64decode(source['content'])))
          allowed = {'index.html','studentworks.html','ai-collaboration.html','404.html','AI-COLLABORATION-FULL.txt','README.md','GITHUB-PAGES.md','SUBMISSION-CHECKLIST.md','TESTING.md','TEST-RESULTS.json','PUBLISH-STATUS.json','SOURCES.md','robots.txt','sitemap.xml','.nojekyll'}
          entries = []
          for item in release['files']:
              path = item['path']
              if path not in allowed and not (path.startswith('graph/') and '/' not in path[6:]):
                  raise ValueError('Unexpected release path: ' + path)
              data = base64.b64decode(item['content']) if item['encoding']=='base64' else item['content'].encode('utf-8')
              if hashlib.sha256(data).hexdigest() != item['sha256']:
                  raise ValueError('Checksum mismatch: ' + path)
              blob = api('/git/blobs', {'encoding':'base64','content':base64.b64encode(data).decode()}, 'POST')
              entries.append({'path':path,'mode':'100644','type':'blob','sha':blob['sha']})
          head = api('/git/ref/heads/main')['object']['sha']
          previous = api('/git/commits/' + head)
          tree = api('/git/trees', {'base_tree':previous['tree']['sha'],'tree':entries}, 'POST')
          commit = api('/git/commits', {'message':'Publish complete academic-style TCU website and nine-prompt record','tree':tree['sha'],'parents':[head]}, 'POST')
          api('/git/refs/heads/main', {'sha':commit['sha'],'force':False}, 'PATCH')
          print('Imported files:', len(entries))
          print('Website commit:', commit['sha'])
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write('Imported the checked department website to main. Existing unrelated files are preserved.\n')
              summary.write('A subsequent user-authenticated commit must trigger branch-based GitHub Pages publishing.\n')
