name: Import verified TCU website
on:
  push:
    branches: [main]
    paths: ['.github/tcu-release-ready.json']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: tcu-site-import
  cancel-in-progress: false
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify and commit department website
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          SOURCE_COMMIT: ${{ github.sha }}
        shell: python
        run: |
          import os, json, base64, lzma, hashlib, urllib.request
          prefix = 'https://api.github.com/repos/' + os.environ['REPOSITORY']
          def api(path, data=None, method='GET'):
              body = None if data is None else json.dumps(data).encode()
              req = urllib.request.Request(prefix + path, data=body, method=method)
              req.add_header('Authorization', 'Bearer ' + os.environ['GH_TOKEN'])
              req.add_header('Accept', 'application/vnd.github+json')
              req.add_header('X-GitHub-Api-Version', '2022-11-28')
              if body is not None:
                  req.add_header('Content-Type', 'application/json')
              with urllib.request.urlopen(req, timeout=60) as response:
                  return json.load(response)
          def read(path):
              result = api('/contents/' + path + '?ref=' + os.environ['SOURCE_COMMIT'])
              return base64.b64decode(result['content'])
          manifest = json.loads(read('.github/tcu-release-ready.json'))
          parts = []
          for part in manifest['parts']:
              if not part['path'].startswith('.github/tcu-release-parts/'):
                  raise ValueError('Unexpected part path')
              data = read(part['path']).strip()
              if hashlib.sha256(data).hexdigest() != part['sha256']:
                  raise ValueError('Part checksum mismatch: ' + part['path'])
              parts.append(data)
          compressed = base64.b64decode(b''.join(parts), validate=True)
          if hashlib.sha256(compressed).hexdigest() != manifest['sha256']:
              raise ValueError('Release checksum mismatch')
          release = json.loads(lzma.decompress(compressed))
          allowed = {'index.html','studentworks.html','ai-collaboration.html','404.html','AI-COLLABORATION-FULL.txt','README.md','GITHUB-PAGES.md','SUBMISSION-CHECKLIST.md','TESTING.md','TEST-RESULTS.json','PUBLISH-STATUS.json','SOURCES.md','robots.txt','sitemap.xml','.nojekyll'}
          entries = []
          for item in release['files']:
              path = item['path']
              if path not in allowed and not (path.startswith('graph/') and '/' not in path[6:] and '..' not in path):
                  raise ValueError('Unexpected release path: ' + path)
              data = base64.b64decode(item['content']) if item['encoding']=='base64' else item['content'].encode('utf-8')
              if hashlib.sha256(data).hexdigest() != item['sha256']:
                  raise ValueError('File checksum mismatch: ' + path)
              blob = api('/git/blobs', {'encoding':'base64','content':base64.b64encode(data).decode()}, 'POST')
              entries.append({'path':path,'mode':'100644','type':'blob','sha':blob['sha']})
          head = api('/git/ref/heads/main')['object']['sha']
          previous = api('/git/commits/' + head)
          tree = api('/git/trees', {'base_tree':previous['tree']['sha'],'tree':entries}, 'POST')
          commit = api('/git/commits', {'message':'Publish verified academic-style TCU site with all media and nine-prompt record','tree':tree['sha'],'parents':[head]}, 'POST')
          api('/git/refs/heads/main', {'sha':commit['sha'],'force':False}, 'PATCH')
          print('Imported files:', len(entries))
          print('Website commit:', commit['sha'])
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write('Imported the verified department website to main. Unrelated existing files were preserved.\n')
              summary.write('A user-authenticated follow-up commit must trigger branch-based GitHub Pages publishing.\n')
